name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer push lands on the same ref. Cuts
# wall time on rapid push-on-push by ~30-60s of wasted CI quota.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: servers/postgres-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: servers/postgres-readonly/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `--reporter=json` alongside the default one, so the count is measured
      # from the run this job already performs rather than re-running the suite
      # (#166). The freshness half of the README test-count lock: the static
      # checks in `check-readme.mjs` cannot tell a stale recorded count from a
      # current one, because they only read files.
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/vitest-report.json
      - name: README test count matches what ran
        working-directory: .
        run: node tools/check-test-count.mjs postgres-readonly /tmp/vitest-report.json
      - run: npm run build

  github-gists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: servers/github-gists
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: servers/github-gists/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `--reporter=json` alongside the default one, so the count is measured
      # from the run this job already performs rather than re-running the suite
      # (#166). The freshness half of the README test-count lock: the static
      # checks in `check-readme.mjs` cannot tell a stale recorded count from a
      # current one, because they only read files.
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/vitest-report.json
      - name: README test count matches what ran
        working-directory: .
        run: node tools/check-test-count.mjs github-gists /tmp/vitest-report.json
      - run: npm run build

  internal-tools-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: servers/internal-tools-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: servers/internal-tools-bridge/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `--reporter=json` alongside the default one, so the count is measured
      # from the run this job already performs rather than re-running the suite
      # (#166). The freshness half of the README test-count lock: the static
      # checks in `check-readme.mjs` cannot tell a stale recorded count from a
      # current one, because they only read files.
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/vitest-report.json
      - name: README test count matches what ran
        working-directory: .
        run: node tools/check-test-count.mjs internal-tools-bridge /tmp/vitest-report.json
      - run: npm run build

  filesystem-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: servers/filesystem-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: servers/filesystem-sandbox/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `--reporter=json` alongside the default one, so the count is measured
      # from the run this job already performs rather than re-running the suite
      # (#166). The freshness half of the README test-count lock: the static
      # checks in `check-readme.mjs` cannot tell a stale recorded count from a
      # current one, because they only read files.
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/vitest-report.json
      - name: README test count matches what ran
        working-directory: .
        run: node tools/check-test-count.mjs filesystem-sandbox /tmp/vitest-report.json
      - run: npm run build

  filesystem-sandbox-py:
    # Python parity server (servers/filesystem-sandbox-py). The four jobs
    # above cover the TS servers; without this job the Python port's pytest
    # suite and ruff checks never run in CI — readme-check only counts its
    # `def test_` for the test-count claim, so a behavioral regression like
    # the isError parity break in #88 could land green. See #90.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: servers/filesystem-sandbox-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The [server] extra pulls the official MCP Python SDK so the
      # isError/round-trip tests exercise the real server wiring rather
      # than skipping; [dev] pulls pytest + ruff.
      - run: pip install -e '.[server,dev]'
      - run: ruff check .
      - run: ruff format --check .
      # `--junitxml` alongside the normal output, so the count comes from the
      # run this job already performs (#166). `check-test-count.mjs` subtracts
      # skips, which matters here: the MCP-SDK round-trip tests skip without the
      # `[server]` extra, so the collected total moves with the install line
      # while the number a reader sees printed does not.
      - run: pytest --junitxml=/tmp/pytest-report.xml
      - name: README test count matches what ran
        working-directory: .
        run: node tools/check-test-count.mjs filesystem-sandbox-py /tmp/pytest-report.xml

  memory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify MEMORY directory exists and has required files
        run: |
          test -f MEMORY/full_history_ai.md
          test -f MEMORY/full_history_human.md
          test -f MEMORY/core_decisions_ai.md
          test -f MEMORY/core_decisions_human.md
      - name: Verify D-001 baseline decision exists
        run: |
          grep -q "id: D-001" MEMORY/core_decisions_ai.md

  spec-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify every server pins the SDK to docs/spec-version.md
        run: node tools/check-spec-version.mjs
      - name: Run the spec-version script's own unit tests
        run: node --test tools/check-spec-version.test.mjs

  readme-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify README server refs + test-count claims match reality
        run: node tools/check-readme.mjs
      - name: Run the README check script's own unit tests
        run: node --test tools/check-readme.test.mjs
      # The unit lock (#166). `check-readme.mjs` holds the READMEs to
      # tools/test-counts.json and enforces `static <= runtime`; this suite
      # holds the counts file to a *different* unit from the static counter,
      # so a future edit that quietly swaps the recorded number back to the
      # static one fails here instead of being frozen in place by a
      # self-consistent lock. The freshness half runs in each server's own job.
      - name: Run the test-count check script's own unit tests
        run: node --test tools/check-test-count.test.mjs
      - name: Verify every server README ships a claude_desktop_config snippet
        run: node tools/check-claude-desktop-config.mjs
      - name: Run the claude_desktop_config check script's own unit tests
        run: node --test tools/check-claude-desktop-config.test.mjs
      - name: Verify every TypeScript server refuses a bad boot config with one line
        run: node tools/check-boot-config-guard.mjs
      - name: Run the boot-config guard's own unit tests
        run: node --test tools/check-boot-config-guard.test.mjs

  architecture-doc-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify docs/architecture.md server refs and stale-phrase absence
        run: node tools/check-architecture-doc.mjs
      - name: Run the architecture-doc check script's own unit tests
        run: node --test tools/check-architecture-doc.test.mjs

  capture-demo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the 60-second demo capture orchestrator's own unit tests
        run: node --test tools/capture-demo.test.mjs

  workflow-yaml-check:
    # Inverse safety net for the 21-day silent CI outage closed in
    # portfolio-ops#27. Parses every .github/workflows/*.yml and asserts
    # a non-empty `jobs:` mapping. See tools/check-workflow-yaml.mjs.
    #
    # Extended in #48 to also enforce timeout-minutes on every job
    # (silent-rot propagation from llm-eval-harness#63 / portfolio-ops#36).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Verify every workflow YAML parses + has non-empty jobs
        run: node tools/check-workflow-yaml.mjs
      - name: Run the workflow-yaml check script's own unit tests
        run: node --test tools/check-workflow-yaml.test.mjs
      - name: Verify every workflow job has a sensible timeout-minutes
        run: node tools/check-workflow-timeout.mjs
      - name: Run the workflow-timeout check script's own unit tests
        run: node --test tools/check-workflow-timeout.test.mjs

  numeric-env-grammar-check:
    # Every numeric environment variable across the cookbook parses one
    # grammar (#152). Each server is a standalone copy-pasteable package, so
    # the three parsers cannot share a module -- they share a checked
    # contract, the same role check-boot-config-guard.mjs plays for the
    # boot-failure contract (#151). The population is discovered from
    # servers/, so a fifth server inherits the rule.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Verify every numeric env parser shares one grammar
        run: node tools/check-numeric-env-grammar.mjs
      - name: Run the numeric-env-grammar check script's own unit tests
        run: node --test tools/check-numeric-env-grammar.test.mjs

  string-env-grammar-check:
    # Every *string* environment setting across the cookbook honours one rule
    # (#158): a whitespace-only value is indistinguishable from the setting
    # being absent. postgres-readonly's DATABASE_URL was neither trimmed nor
    # blank-checked, so one stray space silently redirected the connection to
    # host "base" as the process's OS user (#157). The sibling of the numeric
    # grammar check above -- same discovered population, same exit-code
    # contract, and the two partition the env surface rather than overlapping:
    # a numeric read's blankness belongs to its grammar gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Verify every string env setting honours the blank rule
        run: node tools/check-string-env-grammar.mjs
      - name: Run the string-env-grammar check script's own unit tests
        run: node --test tools/check-string-env-grammar.test.mjs

  config-port-parity-check:
    # The two filesystem-sandbox ports read the same SET of env settings (#168).
    # The two grammar checks above scan `.ts` only, so the Python port is
    # outside both -- a scope they now declare rather than leave implied. And
    # the behavioural parity tests (test_config_trim_parity.py and its TS
    # mirror) enumerate the three settings BY HAND, so a fourth setting added
    # to one port only gets no coverage from them either. This check is that
    # one question and only that one; this pair has already had four
    # divergences fixed by hand (#52, #98, #137, #139).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Verify both filesystem-sandbox ports read the same settings
        run: node tools/check-config-port-parity.mjs
      - name: Run the config-port-parity check script's own unit tests
        run: node --test tools/check-config-port-parity.test.mjs
