[project]
name = "mcp-cookbook-filesystem-sandbox-py"
version = "0.1.0"
description = "Python parity port of the filesystem-sandbox MCP server. Same threat model, same security primitive, exposed via the official Python MCP SDK."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "JT McHorse" }]

# The security primitive (filesystem_sandbox.sandbox + tools) is
# dependency-free. The `[server]` extra adds the official MCP Python
# SDK (the same upstream the TS cookbook pins via
# `@modelcontextprotocol/sdk`), needed only when wiring the primitive
# into the MCP server boilerplate.
dependencies = []

[project.optional-dependencies]
server = ["mcp>=1.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.7"]

[project.scripts]
mcp-filesystem-sandbox-py = "filesystem_sandbox.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["filesystem_sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
# ruff 0.16.1 extended `ruff format` to Python code blocks inside Markdown.
# CI installs ruff unpinned (`pip install -e '.[server,dev]'`), so the tool's
# scope widened overnight. Six sibling repos went red on committed Markdown
# that had never been in scope; here it is still latent only because this
# package's README happens to already be formatted (#132). This package's
# lint contract has always been "format Python source"; prose is not Python
# source. Re-state the scope the config always meant.
extend-exclude = ["*.md"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Without this block the package inherits whatever ruff's *default* rule
# selection happens to be on the day CI runs — which is how 0.16.1 turned a
# clean tree into 8 errors with nothing here changed. Every other Python
# package in the portfolio declares this exact list; state it here too so
# what CI enforces is a property of the repo, not of the release calendar.
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]
ignore = ["E501"]
